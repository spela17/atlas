belmans:
  title: Noncommutative cubic 4-folds
  speaker: belmans
  abstract: >
    <p> I will describe constructions of noncommutative cubic 4-folds, using suitable 6-dimensional Artin-Schelter regular algebras, and what happens to the link between cubic 4-folds and K3 categories when the cubic 4-folds become noncommutative. We will see that several of Michel’s important contributions to noncommutative algebraic geometry play an essential role in these constructions.


bridgeland:
  title: Elliptic curves, boomerangs and del Pezzo surfaces
  speaker: bridgeland
  abstract: >
    <p>  We consider moduli spaces parameterising bundles on an elliptic curve C equipped with two filtrations whose factors are semistable of ascending slope. Such moduli spaces occur as Betti moduli spaces for q-difference equations, and are also very natural from the point-of-view of derived categories. The main result gives a description of a class of such moduli spaces in terms of universal families of anti-canonical embeddings of C into del Pezzo surfaces. This is joint work with Pierrick Bousseau and Luca Giovenzana.

keller:
  title: Report on Kong-Liu-Shen's disproof of Han's conjecture
  speaker: keller
  abstract: >
    <p> In 2006, Yang Han conjectured that a finite-dimensional algebra has finite global dimension if its Hochschild homologyvanishes in all sufficiently high degrees. The analogous statement forfinitely generated commutative algebras follows from work of BACH and of Avramov--Vigué-Poirier. The conjecture itself was shown to hold for many classes of algebras by several authors including Bergh, Cibils, Erdmann, Lanzilotta, Marcos, Redondo, Solotar, Suarez-Alvarez, Vivas, Ren Wang, Xiaoxiao Xu, Yunge Xu, Jinbi Zhang, and Guodong Zhou. In late August 2026, Bochao Kong, Yeqin Liu and Yu Shen posted a preprint where they construct a counter-example starting from Krah's universal phantom on the blow-up of the projective plane in 10 general points.  We will sketch their construction, focusing on the passage from a proper dg algebra to a finite-dimensional algebra concentrated in degree zero.


